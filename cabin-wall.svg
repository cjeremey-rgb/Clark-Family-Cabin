<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b1f10"/><stop offset="0.18" stop-color="#6d3b1c"/><stop offset="0.42" stop-color="#8a5129"/><stop offset="0.62" stop-color="#5b2e16"/><stop offset="0.82" stop-color="#7b4320"/><stop offset="1" stop-color="#351b0d"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.22" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix in="noise" values="0.7 0 0 0 0.15  0 0.48 0 0 0.07  0 0 0.25 0 0.02  0 0 0 .42 0" result="brownnoise"/>
      <feBlend in="SourceGraphic" in2="brownnoise" mode="multiply"/>
    </filter>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <radialGradient id="knot"><stop offset="0" stop-color="#160b06"/><stop offset=".3" stop-color="#42200f"/><stop offset=".55" stop-color="#8b4c24"/><stop offset=".8" stop-color="#3b1a0d"/><stop offset="1" stop-color="#6b371b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="2400" fill="#24120a"/>
  <g filter="url(#grain)">
    <g>
      <rect x="0" y="0" width="1600" height="300" rx="24" fill="url(#wood)"/>
      <rect x="0" y="300" width="1600" height="300" rx="24" fill="url(#wood)" transform="scale(-1 1) translate(-1600 0)"/>
