  <g opacity=".6" fill="#130905">
    <rect y="294" width="1600" height="12"/><rect y="594" width="1600" height="12"/><rect y="894" width="1600" height="12"/><rect y="1194" width="1600" height="12"/><rect y="1494" width="1600" height="12"/><rect y="1794" width="1600" height="12"/><rect y="2094" width="1600" height="12"/>
