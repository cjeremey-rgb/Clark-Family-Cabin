      <rect x="0" y="900" width="1600" height="300" rx="24" fill="url(#wood)" transform="scale(-1 1) translate(-1600 0)"/>
      <rect x="0" y="1200" width="1600" height="300" rx="24" fill="url(#wood)"/>
      <rect x="0" y="1500" width="1600" height="300" rx="24" fill="url(#wood)" transform="scale(-1 1) translate(-1600 0)"/>
