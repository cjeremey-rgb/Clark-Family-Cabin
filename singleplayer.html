<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24140b">
<title>Huckleberry Bucket — Single Player</title><link rel="stylesheet" href="styles.css"></head><body>
<main id="gameScreen" class="game-screen single-game">
<header class="game-header"><button id="homeBtn" class="icon-button">⌂</button><div><h1>Huckleberry Bucket</h1><p id="handLabel">Hand 1 of 5 • Single Player</p></div><button id="rulesBtn" class="icon-button">?</button></header>
<section id="opponents" class="opponents"></section>
<section class="table-stage"><div class="draw-area"><button id="deckButton" class="deck-button"><img src="card-back.png" alt="Berry patch deck"><span>Berry Patch</span></button><div class="latest-wrap"><div id="latestPlaceholder" class="latest-placeholder">Latest card</div><img id="latestCard" class="latest-card hidden"><div id="latestWho" class="latest-who"></div></div></div><div id="message" class="message">Your turn — Pick Another or Take a Break.</div><div id="eventLog" class="event-log"></div></section>
<section id="playerPanel" class="player-panel"></section>
<nav class="action-bar"><button id="pickBtn" class="primary-action">🫐 Pick Another</button><button id="breakBtn" class="secondary-action">☕ Take a Break</button></nav>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><div id="modalContent"></div><div id="modalActions" class="modal-actions"></div></div></div>
<script src="singleplayer.js"></script></body></html>
