<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142d1f"><title>Clark Family Cabin</title><link rel="stylesheet" href="styles.css">
</head><body>
<section id="startScreen" class="start-screen home-start">
  <img src="startup.png" alt="Clark Family Cabin">
  <button id="startHotspot" class="start-hotspot" aria-label="Pick Huckleberries"></button>
</section>
<section id="modeScreen" class="mode-screen hidden">
  <div class="mode-shell">
    <button id="modeBack" class="back-button">← Cabin</button>
    <div class="wood-sign mode-sign"><h1>Choose Game Mode</h1><p>Huckleberry Bucket</p></div>
    <div class="mode-cards">
      <button class="mode-card" id="singleBtn">
        <img class="mode-bucket" src="mode-bucket.png" alt="Bucket of huckleberries"><h2>Single<br>Player</h2><p>Play against computer opponents.</p><span>Play Solo</span>
      </button>
      <button class="mode-card" id="multiBtn">
        <div class="multi-buckets"><img class="mode-bucket" src="mode-bucket.png" alt="Bucket of huckleberries"><img class="mode-bucket second" src="mode-bucket.png" alt=""></div><h2>Multiplayer</h2><p>Play with family and friends online.</p><span>Play Online</span>
      </button>
    </div>
  </div>
</section>
<script>
const s=document.getElementById('startScreen'),m=document.getElementById('modeScreen');
document.getElementById('startHotspot').onclick=()=>{s.classList.add('hidden');m.classList.remove('hidden')};
document.getElementById('modeBack').onclick=()=>{m.classList.add('hidden');s.classList.remove('hidden')};
document.getElementById('singleBtn').onclick=()=>location.href='singleplayer.html';
document.getElementById('multiBtn').onclick=()=>location.href='multiplayer.html';
</script>
</body></html>
