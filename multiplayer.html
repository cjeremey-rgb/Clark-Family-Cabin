<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1409"><title>Huckleberry Bucket — Multiplayer</title><link rel="stylesheet" href="styles.css"></head><body class="cabin-world">
<section class="lobby-screen"><div class="lobby-shell"><button id="backBtn" class="premium-btn wood back-btn">← Back</button><div class="wood-plaque lobby-title">Multiplayer</div><div id="entryPanel"><div class="tabs"><button id="createTab" class="premium-btn tab-btn">Create Room</button><button id="joinTab" class="premium-btn wood tab-btn">Join Room</button></div><div id="createPane" class="entry-panel parchment"><h2>Create a New Room</h2><label>Your Name</label><input id="nameInput" maxlength="18" placeholder="Enter your name"><label>Max Players</label><div class="player-count"><button data-n="2">2</button><button data-n="3" class="selected">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button></div><button id="createBtn" class="premium-btn" style="width:100%">Create Room</button><p class="entry-help">Create a room and share the 4-character code. Everyone joins the same room to play together.</p></div><div id="joinPane" class="entry-panel parchment hidden"><h2>Join a Room</h2><label>Room Code</label><input id="roomCodeInput" maxlength="4" placeholder="AB12" style="text-align:center;text-transform:uppercase;letter-spacing:.25em;font-size:22px"><label>Your Name</label><input id="joinNameInput" maxlength="18" placeholder="Enter your name"><button id="joinBtn" class="premium-btn" style="width:100%;margin-top:15px">Join Room</button><p class="entry-help">Ask the host for the 4-character room code and enter it above.</p></div><div id="entryError" class="error-text"></div></div>
<div id="roomPanel" class="hidden"><div class="entry-panel parchment"><h2>Room Lobby</h2><div class="room-code" id="roomCodeText"></div><button id="shareBtn" class="premium-btn wood" style="width:100%;margin:8px 0 12px">Share Code</button><div id="lobbyPlayers" class="lobby-list"></div><button id="startBtn" class="premium-btn" style="width:100%;margin-top:14px">Start Game</button><button id="leaveBtn" class="premium-btn red" style="width:100%;margin-top:9px">Leave Room</button></div></div></div></section>
<div id="toast" class="toast hidden"></div><script src="/socket.io/socket.io.js"></script><script src="multiplayer-lobby.js"></script></body></html>
